name: Build Full PojavLauncher Nightly IPA

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Full iOS IPA
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fix dead submodule URLs and checkout submodules
        run: |
          git config --file=.gitmodules submodule.Natives/DBNumberedSlider.url https://github.com || true
          git config --file=.gitmodules submodule.Natives/fishhook.url https://github.com || true
          git submodule sync
          git submodule update --init --recursive

      - name: Select Xcode 16
        run: sudo xcode-select -s /Applications/Xcode_16.0.app

      - name: Install build dependencies
        run: |
          brew install make ldid cmake wget temurin@8
          export PATH="/opt/homebrew/bin:$PATH"

      - name: Download Java Runtimes (JRE 8, 17, 21) for Full IPA
        run: |
          mkdir -p depends
          cd depends
          curl -fL -o jre8-ios-aarch64.tar.xz "https://github.com" || true
          curl -fL -o jre17-ios-aarch64.tar.xz "https://github.com" || true
          curl -fL -o jre21-ios-aarch64.tar.xz "https://github.com" || true
          ls -lh

      - name: Build Full iOS IPA
        run: |
          export PATH="/opt/homebrew/bin:$PATH"
          export JAVA_HOME=$(/usr/libexec/java_home -v 1.8)
          export RUNNER=1
          gmake -j$(sysctl -n hw.ncpu) dsym package PLATFORM=2

      - name: Upload Full IPA
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: net.kdt.pojavlauncher-full-ios.ipa
          path: artifacts/net.kdt.pojavlauncher-*-ios.ipa
          if-no-files-found: warn
