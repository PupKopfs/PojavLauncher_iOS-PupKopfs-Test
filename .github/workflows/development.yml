name: Build Full PojavLauncher 3.0 Nightly IPA

on:
  push:
  workflow_dispatch:

jobs:
  build:
    name: Build Full iOS IPA
    runs-on: macos-15-intel

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fix dead submodule URLs and checkout submodules
        run: |
          git config --file=.gitmodules submodule.Natives/DBNumberedSlider.url https://github.com || true
          git config --file=.gitmodules submodule.Natives/fishhook.url https://github.com || true
          git submodule sync
          git submodule update --init --recursive

      - name: Install build dependencies
        run: brew install make ldid cmake wget temurin@8

      - name: Get JRE8 (Official AngelAuraMC)
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: build.yml
          path: depends
          workflow_conclusion: success
          allow_forks: true
          repo: AngelAuraMC/angelauramc-openjdk-build
          branch: buildjre8
          name: jre8-ios-aarch64

      - name: Get JRE17 (Official AngelAuraMC)
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: build.yml
          path: depends
          workflow_conclusion: completed
          allow_forks: true
          repo: AngelAuraMC/angelauramc-openjdk-build
          branch: buildjre17-21
          name: jre17-ios-aarch64

      - name: Get JRE21 (Official AngelAuraMC)
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: build.yml
          path: depends
          workflow_conclusion: completed
          allow_forks: true
          repo: AngelAuraMC/angelauramc-openjdk-build
          branch: buildjre17-21
          name: jre21-ios-aarch64

      - name: Build Full PojavLauncher 3.0 IPA
        run: |
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          export JAVA_HOME=$(/usr/libexec/java_home -v 1.8)
          export CFLAGS="-Wno-error=incompatible-function-pointer-types -Wno-error=implicit-function-declaration -Wno-error=implicit-int -Wno-error=int-conversion"
          export OBJCFLAGS="$CFLAGS"
          gmake -j$(sysctl -n hw.ncpu) package PLATFORM=2 RUNNER=1

      - name: Upload Full IPA
        uses: actions/upload-artifact@v4
        with:
          name: net.kdt.pojavlauncher-full-3.0-ios.ipa
          path: artifacts/*.ipa
