name: Build PojavLauncher 3.0 Nightly IPA

on:
  push:
  workflow_dispatch:

jobs:
  build:
    name: Build iOS IPA
    runs-on: macos-15-intel

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fix dead submodule URLs and checkout submodules
        run: |
          git config --file=.gitmodules submodule.Natives/DBNumberedSlider.url https://github.com || true
          git config --file=.gitmodules submodule.Natives/fishhook.url https://github.com || true
          git submodule sync
          git submodule update --init --recursive

      - name: Select Xcode 16
        run: sudo xcode-select -s /Applications/Xcode_16.0.app

      - name: Install build dependencies
        run: brew install make ldid cmake wget temurin@8

      - name: Build PojavLauncher 3.0 IPA
        run: |
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          export JAVA_HOME=$(/usr/libexec/java_home -v 1.8)
          export RUNNER=1 SLIMMED=1
          export CFLAGS="-Wno-error=incompatible-function-pointer-types -Wno-error=implicit-function-declaration -Wno-error=implicit-int -Wno-error=int-conversion"
          export OBJCFLAGS="$CFLAGS"
          gmake -j$(sysctl -n hw.ncpu) dsym package PLATFORM=2

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: net.kdt.pojavlauncher.slimmed-3.0-ios.ipa
          path: artifacts/*.ipa
