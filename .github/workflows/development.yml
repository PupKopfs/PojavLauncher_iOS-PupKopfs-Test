name: Build Full PojavLauncher 3.0 Nightly IPA

on:
  push:
  workflow_dispatch:

jobs:
  build:
    name: Build Full iOS IPA
    runs-on: macos-15-intel

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fix dead submodule URLs and checkout submodules
        run: |
          git config --file=.gitmodules submodule.Natives/DBNumberedSlider.url https://github.com || true
          git config --file=.gitmodules submodule.Natives/fishhook.url https://github.com || true
          git submodule sync
          git submodule update --init --recursive

      - name: Install build dependencies
        run: brew install make ldid cmake wget temurin@8

      - name: Download Java Runtimes (JRE 8, 17, 21) from Official Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p depends/raw
          for repo in "AngelAuraMC/amethyst-prebuilt-libraries" "AngelAuraMC/angelauramc-openjdk-build" "PojavLauncherTeam/android-openjdk-build-multiarch"; do
            for tag in $(gh release list -R "$repo" --limit 20 --json tagName -q '.[].tagName' 2>/dev/null); do
              gh release download "$tag" -R "$repo" \
                --pattern "*ios*.tar.xz" \
                --pattern "*arm64*.tar.xz" \
                --pattern "*aarch64*.tar.xz" \
                -D depends/raw --skip-existing 2>/dev/null || true
            done
          done
          ls -lh depends/raw
          cp "$(ls depends/raw/*8*.tar.xz | grep -iv android | head -n 1)" depends/jre8-ios-aarch64.tar.xz
          cp "$(ls depends/raw/*17*.tar.xz | grep -iv android | head -n 1)" depends/jre17-ios-aarch64.tar.xz
          cp "$(ls depends/raw/*21*.tar.xz | grep -iv android | head -n 1)" depends/jre21-ios-aarch64.tar.xz
          rm -rf depends/raw
          ls -lh depends

      - name: Build Full PojavLauncher 3.0 IPA
        run: |
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          export JAVA_HOME=$(/usr/libexec/java_home -v 1.8)
          export CFLAGS="-Wno-error=incompatible-function-pointer-types -Wno-error=implicit-function-declaration -Wno-error=implicit-int -Wno-error=int-conversion"
          export OBJCFLAGS="$CFLAGS"
          gmake -j$(sysctl -n hw.ncpu) package PLATFORM=2 RUNNER=1

      - name: Upload Full IPA
        uses: actions/upload-artifact@v4
        with:
          name: net.kdt.pojavlauncher-full-3.0-ios.ipa
          path: artifacts/*.ipa
