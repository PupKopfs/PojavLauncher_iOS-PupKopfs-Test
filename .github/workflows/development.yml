name: Build PojavLauncher iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build-ipa:
    runs-on: macos-15-intel

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup JDK 8, 17, and 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: |
            8
            17
            21

      - name: Register all 3 JDKs for macOS java_home & install tools
        run: |
          # Link all installed Temurin JDKs into macOS standard JVM folder so /usr/libexec/java_home finds all 3
          sudo mkdir -p /Library/Java/JavaVirtualMachines
          for jdk in "$RUNNER_TOOL_CACHE"/Java_Temurin-Hotspot_jdk/*/*; do
            if [ -d "$jdk/Contents/Home" ]; then
              sudo ln -sfn "$jdk" "/Library/Java/JavaVirtualMachines/$(basename "$jdk")-$(basename "$(dirname "$jdk")").jdk"
            fi
          done
          /usr/libexec/java_home -V

          # Install GNU make & link to /opt/homebrew/bin/gmake for Xcode
          brew install make xcodegen ldid cmake ninja || true
          sudo mkdir -p /opt/homebrew/bin
          sudo ln -sf "$(which gmake)" /opt/homebrew/bin/gmake
          sudo ln -sf "$(which ldid)" /opt/homebrew/bin/ldid

      - name: Build PojavLauncher & Package IPA
        run: |
          set -e
          
          # 1. Generate Xcode project if project.yml exists
          if [ -f "project.yml" ]; then
            xcodegen generate
          fi

          # 2. Run Makefile setup/deploy if present
          if [ -f "Makefile" ]; then
            gmake deploy || gmake package || gmake all || true
          fi

          # 3. Check if Makefile already produced an .ipa
          FOUND_IPA=$(find . -maxdepth 4 -name "*.ipa" | head -n 1)
          
          # 4. Build specifically with the iOS SDK & bundle JREs
          if [ -z "$FOUND_IPA" ]; then
            xcodebuild \
              -project PojavLauncher.xcodeproj \
              -scheme PojavLauncher \
              -configuration Release \
              -sdk iphoneos \
              -arch arm64 \
              ONLY_ACTIVE_ARCH=NO \
              SUPPORTED_PLATFORMS=iphoneos \
              EFFECTIVE_PLATFORM_NAME=-iphoneos \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO \
              CONFIGURATION_BUILD_DIR="$RUNNER_TEMP/Build" \
              clean build

            mkdir -p "$RUNNER_TEMP/Payload"
            APP_BUNDLE=$(find "$RUNNER_TEMP/Build" -maxdepth 2 -name "*.app" | head -n 1)
            cp -r "$APP_BUNDLE" "$RUNNER_TEMP/Payload/"
            
            codesign --force --deep --sign - --timestamp=none "$RUNNER_TEMP/Payload/"*.app
            
            cd "$RUNNER_TEMP"
            zip -qr "$GITHUB_WORKSPACE/PojavLauncher.ipa" Payload
          else
            cp "$FOUND_IPA" "$GITHUB_WORKSPACE/PojavLauncher.ipa"
          fi

      - name: Upload PojavLauncher IPA
        uses: actions/upload-artifact@v4
        with:
          name: PojavLauncher-iOS-IPA
          path: ${{ github.workspace }}/PojavLauncher.ipa
