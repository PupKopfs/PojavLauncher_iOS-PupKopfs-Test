name: Build Full PojavLauncher 3.0 Nightly IPA

on:
  push:
  workflow_dispatch:

jobs:
  build:
    name: Build Full iOS IPA
    runs-on: macos-15-intel

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fix dead submodule URLs and checkout submodules
        run: |
          git config --file=.gitmodules submodule.Natives/DBNumberedSlider.url https://github.com || true
          git config --file=.gitmodules submodule.Natives/fishhook.url https://github.com || true
          git submodule sync
          git submodule update --init --recursive

      - name: Install build dependencies
        run: brew install make ldid cmake wget temurin@8

      - name: Download Java Runtimes (JRE 8, 17, 21) from Official Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p depends
          for tag in $(gh release list -R AngelAuraMC/amethyst-prebuilt-libraries --json tagName -q '.[].tagName'); do
            gh release download "$tag" -R AngelAuraMC/amethyst-prebuilt-libraries \
              --pattern "*jre8*ios*.tar.xz" \
              --pattern "*jre17*ios*.tar.xz" \
              --pattern "*jre21*ios*.tar.xz" \
              -D depends --skip-existing 2>/dev/null || true
          done
          cd depends
          ls -1 jre8-*.tar.xz | tail -n +2 | xargs rm -f
          ls -1 jre17-*.tar.xz | tail -n +2 | xargs rm -f
          ls -1 jre21-*.tar.xz | tail -n +2 | xargs rm -f
          ls -lh

      - name: Build Full PojavLauncher 3.0 IPA
        run: |
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          export JAVA_HOME=$(/usr/libexec/java_home -v 1.8)
          export CFLAGS="-Wno-error=incompatible-function-pointer-types -Wno-error=implicit-function-declaration -Wno-error=implicit-int -Wno-error=int-conversion"
          export OBJCFLAGS="$CFLAGS"
          gmake -j$(sysctl -n hw.ncpu) package PLATFORM=2 RUNNER=1

      - name: Upload Full IPA
        uses: actions/upload-artifact@v4
        with:
          name: net.kdt.pojavlauncher-full-3.0-ios.ipa
          path: artifacts/*.ipa
