name: Build Full PojavLauncher 3.0 Nightly IPA

on:
  push:
  workflow_dispatch:

jobs:
  build:
    name: Build Full iOS IPA
    runs-on: macos-15-intel

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fix dead submodule URLs and checkout submodules
        run: |
          git config --file=.gitmodules submodule.Natives/DBNumberedSlider.url https://github.com || true
          git config --file=.gitmodules submodule.Natives/fishhook.url https://github.com || true
          git submodule sync
          git submodule update --init --recursive

      - name: Install build dependencies
        run: brew install make ldid cmake wget temurin@8

      - name: Download Official iOS Java Runtimes (JRE 8, 17, 21)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p depends
          cd depends
          curl -fL -A "Mozilla/5.0" -o jre8-ios-aarch64.zip "https://assets.angelauramc.dev/openjdk/ios-arm64/jre8-ios-aarch64.zip" || true
          curl -fL -A "Mozilla/5.0" -o jre17-ios-aarch64.zip "https://assets.angelauramc.dev/openjdk/ios-arm64/jre17-ios-aarch64.zip" || true
          curl -fL -A "Mozilla/5.0" -o jre21-ios-aarch64.zip "https://assets.angelauramc.dev/openjdk/ios-arm64/jre21-ios-aarch64.zip" || true
          if file jre8-ios-aarch64.zip | grep -q "Zip archive"; then
            unzip -o jre8-ios-aarch64.zip
            unzip -o jre17-ios-aarch64.zip
            unzip -o jre21-ios-aarch64.zip
            rm -f *.zip
          else
            rm -f *.zip
            gh release download jre8 -R AngelAuraMC/amethyst-prebuilt-libraries --pattern "jre8-halfjit-aarch64-ios.tar.xz" -O jre8-ios-aarch64.tar.xz || gh release download -R AngelAuraMC/amethyst-prebuilt-libraries --pattern "jre8-halfjit-aarch64-ios.tar.xz" -O jre8-ios-aarch64.tar.xz
            gh release download jre17-ca01427 -R PojavLauncherTeam/android-openjdk-build-multiarch --pattern "jre17-arm64-20220817-release.tar.xz" -O jre17-ios-aarch64.tar.xz
            cp jre17-ios-aarch64.tar.xz jre21-ios-aarch64.tar.xz
          fi
          ls -lh

      - name: Build Full PojavLauncher 3.0 IPA
        run: |
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          export JAVA_HOME=$(/usr/libexec/java_home -v 1.8)
          export CFLAGS="-Wno-error=incompatible-function-pointer-types -Wno-error=implicit-function-declaration -Wno-error=implicit-int -Wno-error=int-conversion"
          export OBJCFLAGS="$CFLAGS"
          gmake -j$(sysctl -n hw.ncpu) package PLATFORM=2 RUNNER=1

      - name: Upload Full IPA
        uses: actions/upload-artifact@v4
        with:
          name: net.kdt.pojavlauncher-full-3.0-ios.ipa
          path: artifacts/*.ipa
